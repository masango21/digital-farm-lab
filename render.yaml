# Render Blueprint – deploys the API from the /server folder on the FREE plan.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the secret values when prompted.
services:
  - type: web
    name: digital-farm-lab-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TRAINER_INVITE_CODE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Digital Farm Lab
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: digital-farm-lab
      # AgriLearn Passport: leave the URL empty until AgriLearn gives you one; events queue meanwhile.
      - key: AGRILEARN_WEBHOOK_URL
        sync: false
      - key: AGRILEARN_WEBHOOK_SECRET
        generateValue: true
      - key: CREDENTIAL_MIN_SCORE
        value: "70"
      # Public URL of this API, used in shareable result links (e.g. https://digital-farm-lab-api.onrender.com)
      - key: PUBLIC_BASE_URL
        sync: false
